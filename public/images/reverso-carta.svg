<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 630 880" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="fondo" cx="50%" cy="50%" r="72%">
      <stop offset="0" stop-color="#7fd0ff"/><stop offset=".25" stop-color="#1f8bff"/>
      <stop offset=".6" stop-color="#1243d6"/><stop offset="1" stop-color="#081a78"/>
    </radialGradient>
    <linearGradient id="brazo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".5" stop-color="#7fe4ff" stop-opacity=".6"/><stop offset="1" stop-color="#1a6dff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="rojo" cx="38%" cy="22%" r="85%">
      <stop offset="0" stop-color="#ff9a8d"/><stop offset=".3" stop-color="#e8261d"/><stop offset="1" stop-color="#7d0a08"/>
    </radialGradient>
    <radialGradient id="blanco" cx="50%" cy="85%" r="90%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#e3e7f0"/><stop offset="1" stop-color="#8a92a8"/>
    </radialGradient>
    <linearGradient id="amarillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff77a"/><stop offset=".5" stop-color="#ffcc1e"/><stop offset="1" stop-color="#f59a00"/>
    </linearGradient>
    <radialGradient id="metal" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#c3c9d6"/><stop offset="1" stop-color="#6c7488"/></radialGradient>
    <filter id="b6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="b14" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#021046" flood-opacity=".7"/></filter>
    <clipPath id="bola"><circle cx="315" cy="440" r="141"/></clipPath>
    <path id="estrella" d="M0-1 Q.08-.12 1 0 Q.08.12 0 1 Q-.08.12 -1 0 Q-.08-.12 0-1Z"/>
  </defs>

  <rect width="630" height="880" fill="url(#fondo)"/>

  <!-- remolino: brazos en espiral -->
  <g transform="translate(315 440)" filter="url(#b6)">
    <g id="brazoG">
      <path d="M0 0 C 40 -120 260 -190 420 -60 C 260 -150 80 -110 30 -10Z" fill="url(#brazo)" opacity=".85"/>
    </g>
    <use xlink:href="#brazoG" transform="rotate(72)"/>
    <use xlink:href="#brazoG" transform="rotate(144)"/>
    <use xlink:href="#brazoG" transform="rotate(216)"/>
    <use xlink:href="#brazoG" transform="rotate(288)"/>
  </g>
  <g transform="translate(315 440)" fill="none" stroke="#bff3ff" stroke-linecap="round" opacity=".6">
    <path d="M60 -150 C 190 -230 380 -150 380 20" stroke-width="3"/>
    <path d="M-60 150 C -190 230 -380 150 -380 -20" stroke-width="3"/>
    <path d="M150 60 C 230 190 100 330 -60 330" stroke-width="2.5"/>
    <path d="M-150 -60 C -230 -190 -100 -330 60 -330" stroke-width="2.5"/>
  </g>
  <circle cx="315" cy="440" r="210" fill="#9be6ff" opacity=".35" filter="url(#b14)"/>

  <!-- destellos -->
  <g>
    <use xlink:href="#estrella" transform="translate(120 300) scale(22)" fill="#fff"/>
    <use xlink:href="#estrella" transform="translate(520 360) scale(30)" fill="#ffd2f0"/>
    <use xlink:href="#estrella" transform="translate(560 250) scale(14)" fill="#fff"/>
    <use xlink:href="#estrella" transform="translate(70 520) scale(26)" fill="#ffd9a8"/>
    <use xlink:href="#estrella" transform="translate(170 640) scale(18)" fill="#fff"/>
    <use xlink:href="#estrella" transform="translate(500 560) scale(24)" fill="#fff"/>
    <use xlink:href="#estrella" transform="translate(590 690) scale(16)" fill="#ffb6e6"/>
    <use xlink:href="#estrella" transform="translate(300 245) scale(12)" fill="#fff"/>
    <use xlink:href="#estrella" transform="translate(440 650) scale(13)" fill="#ffe7b0"/>
    <use xlink:href="#estrella" transform="translate(60 380) scale(12)" fill="#fff"/>
    <use xlink:href="#estrella" transform="translate(255 690) scale(20)" fill="#fff"/>
    <use xlink:href="#estrella" transform="translate(40 700) scale(10)" fill="#ffd2f0"/>
    <use xlink:href="#estrella" transform="translate(580 120) scale(10)" fill="#fff"/>
  </g>
  <g fill="#fff" opacity=".85">
    <circle cx="205" cy="420" r="3"/><circle cx="430" cy="290" r="3"/><circle cx="540" cy="470" r="3.5"/>
    <circle cx="100" cy="620" r="3"/><circle cx="360" cy="700" r="3"/><circle cx="150" cy="210" r="3"/>
    <circle cx="470" cy="740" r="3"/><circle cx="35" cy="450" r="2.5"/><circle cx="600" cy="560" r="2.5"/>
  </g>

  <!-- pokéball -->
  <ellipse cx="320" cy="618" rx="140" ry="20" fill="#031050" opacity=".5" filter="url(#b6)"/>
  <circle cx="315" cy="440" r="158" fill="#2b4fb8" opacity=".35" filter="url(#b6)"/>
  <circle cx="315" cy="440" r="150" fill="#0a0a14"/>
  <g clip-path="url(#bola)">
    <rect x="150" y="280" width="330" height="170" fill="url(#rojo)"/>
    <rect x="150" y="430" width="330" height="170" fill="url(#blanco)"/>
    <rect x="150" y="414" width="330" height="40" fill="#0a0a14"/>
    <ellipse cx="315" cy="436" rx="170" ry="16" fill="#fff" filter="url(#b6)"/>
    <ellipse cx="255" cy="340" rx="70" ry="30" fill="#fff" opacity=".4" transform="rotate(-25 255 340)"/>
    <ellipse cx="315" cy="560" rx="100" ry="26" fill="#fff" opacity=".55" filter="url(#b6)"/>
  </g>
  <circle cx="315" cy="436" r="48" fill="#0a0a14"/>
  <circle cx="315" cy="436" r="34" fill="url(#metal)"/>
  <circle cx="315" cy="436" r="34" fill="none" stroke="#fff" stroke-width="3" opacity=".7"/>
  <ellipse cx="305" cy="424" rx="14" ry="8" fill="#fff" opacity=".8"/>

  <!-- texto superior -->
  <g font-family="'Arial Black','Arial Rounded MT Bold',Impact,Arial,sans-serif" font-weight="900" font-style="italic" text-anchor="middle" font-size="104" letter-spacing="-3" filter="url(#sombra)">
    <text x="315" y="190" fill="#0f3a94" stroke="#0f3a94" stroke-width="30" stroke-linejoin="round">POKÉMON</text>
    <text x="315" y="190" fill="url(#amarillo)" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">POKÉMON</text>
  </g>
  <!-- texto inferior -->
  <g transform="rotate(180 315 690)" filter="url(#sombra)">
    <g font-family="'Arial Black','Arial Rounded MT Bold',Impact,Arial,sans-serif" font-weight="900" font-style="italic" text-anchor="middle" font-size="104" letter-spacing="-3">
      <text x="315" y="740" fill="#0f3a94" stroke="#0f3a94" stroke-width="30" stroke-linejoin="round">POKÉMON</text>
      <text x="315" y="740" fill="url(#amarillo)" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">POKÉMON</text>
    </g>
  </g>
</svg>
